name: win 10 RDP tailscale

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
         
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name "ME2008" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "ME2008" -Password $securePass -AccountNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member "ME2008" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "ME2008" -ErrorAction SilentlyContinue
         
          echo "RDP_CREDS= $password" >> $env:GITHUB_ENV
         
          if (-not (Get-LocalUser -Name "ME2008")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.92.3-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
         
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          
          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait
          
          Remove-Item $installerPath -Force


      # ==========================================
      # DOWNLOAD + INSTALL MUMU 6.0.1
      # ==========================================
      - name: Install MuMu Player
        run: |
          $pageUrl = "https://www.mediafire.com/file/t9jtrzhylpbeadz/MuMu_6.0.1_WkSJtMC.exe/file"
          $installerPath = "$env:TEMP\MuMu_6.0.1.exe"

          Write-Host "Downloading MuMu Player 6.0.1..."

          $page = Invoke-WebRequest `
            -Uri $pageUrl `
            -UseBasicParsing

          $downloadUrl = $page.Links |
            Where-Object {
              $_.href -match "download.*mediafire\.com"
            } |
            Select-Object -First 1 -ExpandProperty href

          if (-not $downloadUrl) {
              Write-Host "Normal MediaFire link not found."
              Write-Host "Searching page source..."

              $match = [regex]::Match(
                $page.Content,
                'https://download[^"'' ]+mediafire\.com[^"'' ]+'
              )

              if ($match.Success) {
                  $downloadUrl = $match.Value
              }
          }

          if (-not $downloadUrl) {
              Write-Error "Could not find MediaFire download URL."
              exit 1
          }

          Write-Host "Downloading installer..."

          Invoke-WebRequest `
            -Uri $downloadUrl `
            -OutFile $installerPath `
            -UseBasicParsing

          if (-not (Test-Path $installerPath)) {
              Write-Error "MuMu installer was not downloaded."
              exit 1
          }

          $size = (Get-Item $installerPath).Length

          Write-Host "Installer size: $size bytes"

          if ($size -lt 100000) {
              Write-Error "Downloaded installer appears invalid."
              exit 1
          }

          Write-Host "Installing MuMu Player..."
          Write-Host "Maximum installation wait: 90 seconds"

          $process = Start-Process `
            -FilePath $installerPath `
            -ArgumentList "/S" `
            -PassThru

          $finished = $process.WaitForExit(90000)

          if (-not $finished) {

              Write-Host "MuMu installer did not finish within 90 seconds."

              Stop-Process `
                -Id $process.Id `
                -Force `
                -ErrorAction SilentlyContinue

              Write-Error "MuMu installation timed out."
              exit 1
          }

          Write-Host "MuMu installer finished."
          Write-Host "Exit code: $($process.ExitCode)"

          Remove-Item `
            $installerPath `
            -Force `
            -ErrorAction SilentlyContinue


      # ==========================================
      # FIND + LAUNCH MUMU
      # ==========================================
      - name: Launch MuMu Player
        run: |
          Write-Host "Searching for MuMu Player..."

          $possiblePaths = @(
              "${env:ProgramFiles}\Netease\MuMuPlayerGlobal-6.0\mumuw.exe",
              "${env:ProgramFiles(x86)}\Netease\MuMuPlayerGlobal-6.0\mumuw.exe",
              "${env:ProgramFiles}\Netease\MuMuPlayer-6.0\mumuw.exe",
              "${env:ProgramFiles(x86)}\Netease\MuMuPlayer-6.0\mumuw.exe",
              "${env:ProgramFiles}\MuMu\mumuw.exe",
              "${env:ProgramFiles(x86)}\MuMu\mumuw.exe"
          )

          $mumu = $possiblePaths |
            Where-Object {
              Test-Path $_
            } |
            Select-Object -First 1

          if ($mumu) {

              Write-Host "MuMu found:"
              Write-Host $mumu

              Write-Host "Launching MuMu Player..."

              Start-Process $mumu

              Start-Sleep -Seconds 20

              Write-Host "MuMu Player started."

          }
          else {

              Write-Host "MuMu not found in default paths."
              Write-Host "Searching Program Files..."

              $mumuSearch = Get-ChildItem `
                -Path "C:\Program Files","C:\Program Files (x86)" `
                -Filter "mumuw.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($mumuSearch) {

                  Write-Host "MuMu found:"
                  Write-Host $mumuSearch.FullName

                  Start-Process $mumuSearch.FullName

                  Start-Sleep -Seconds 20

                  Write-Host "MuMu Player started."

              }
              else {

                  Write-Error "MuMu Player executable could not be found."
                  exit 1
              }
          }


      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
         
          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {

              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

              Start-Sleep -Seconds 5

              $retries++
          }
         
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
     
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
         
          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }

          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection + Watch RDP User
        run: |
          Write-Host "Thanks to MR.English2008 for this perfect work"
          Write-Host "follow for more in my telegram channel"
          Write-Host "https://t.me/ME2008_RDP"
          
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: ME2008"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - MR.English2008 "
              Start-Sleep -Seconds 300
          }
